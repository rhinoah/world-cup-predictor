name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # La GUI (customtkinter/pystray) no se instala en CI: los tests cubren el
      # modelo y la capa de datos, que son multiplataforma y sin dependencias graficas.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run tests
        run: pytest
